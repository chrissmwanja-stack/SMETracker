name: Android CI

# Runs on every push and pull request targeting main, so a bad build or a
# lint regression (e.g. the InvalidFragmentVersionForActivityResult error
# fixed in 91b60f7) gets caught before it's merged, not discovered by
# manually running `gradlew build` later.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets you trigger a run manually from the Actions tab without a new commit.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 21, not 17 — this project is on Gradle 9.4.1 / AGP 9.2.1, recent
      # enough that JDK 17 isn't guaranteed sufficient.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Speeds up subsequent runs significantly by caching Gradle
      # dependencies and wrapper downloads between workflow runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Debug lint only — release lint is skipped here since it requires
      # signing config that doesn't exist in CI. Catches the same class of
      # issue (deprecated API usage, manifest errors, resource problems).
      - name: Lint (debug)
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests (debug)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Uploads lint's HTML report as a downloadable artifact so failures can
      # be inspected from the Actions run page without re-running locally.
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14