name: Android CI

# Runs on every push and pull request targeting main, so a bad build or a
# lint regression (e.g. the InvalidFragmentVersionForActivityResult error
# fixed in 91b60f7) gets caught before it's merged, not discovered by
# manually running `gradlew build` later.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets you trigger a run manually from the Actions tab without a new commit.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 21, not 17 — this project is on Gradle 9.4.1 / AGP 9.2.1, recent
      # enough that JDK 17 isn't guaranteed sufficient.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Speeds up subsequent runs significantly by caching Gradle
      # dependencies and wrapper downloads between workflow runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Debug lint only — release lint is skipped here since it requires
      # signing config that doesn't exist in CI. Catches the same class of
      # issue (deprecated API usage, manifest errors, resource problems).
      - name: Lint (debug)
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests (debug)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Uploads lint's HTML report as a downloadable artifact so failures can
      # be inspected from the Actions run page without re-running locally.
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # Everything under app/src/androidTest - SMEDatabaseTest, SessionManagerTest,
  # PhoneAuthEmulatorTest, and the *SyncEmulatorTest suite - was previously
  # 100% manual (see the `build` job above, which only runs unit tests). This
  # job gives it real CI coverage: a Firebase emulator (Auth + Firestore,
  # matching firebase.json) plus a real AVD to run the full instrumented
  # suite against, on every push/PR just like the unit tests.
  #
  # macos-latest, not ubuntu-latest, because it has hardware-accelerated
  # virtualization (HAXM) built in - the Android emulator on a plain
  # ubuntu-latest runner needs extra KVM setup and is meaningfully flakier.
  instrumented-tests:
    needs: build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Node (for the Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Backgrounded - the emulator process needs to keep running underneath
      # the later "Run instrumented tests" step, not block on completing.
      # smetracker-9825a matches google-services.json / FirebaseEmulatorRule's
      # projectId lookup; no login/credentials needed since --only auth,firestore
      # never touches real Firebase infrastructure regardless of project id.
      - name: Start Firebase Auth + Firestore emulators
        run: |
          firebase emulators:start --only auth,firestore --project smetracker-9825a &
          echo $! > firebase-emulator.pid

      - name: Wait for emulators to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:9099 && curl -s -o /dev/null http://127.0.0.1:8080; then
              echo "Emulators are up"
              exit 0
            fi
            sleep 2
          done
          echo "Emulators did not become ready in time"
          exit 1

      # api-level 34 (not compileSdk 37's preview level) - CI emulator images
      # lag behind the newest SDKs, and connectedAndroidTest only needs a real
      # device at or above minSdk 24, not one matching compileSdk/targetSdk.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Stop Firebase emulators
        if: always()
        run: kill "$(cat firebase-emulator.pid)" 2>/dev/null || true

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected
          retention-days: 14